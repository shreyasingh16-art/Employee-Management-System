<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | Emplyra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/employee.css">
</head>
<body>

    <nav class="top-navbar">
        <div class="logo">
            <span>👥</span>
            <span>Emplyra</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="employee.html" class="active">Employee</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html">Leave</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <main class="employee-page">

        <div class="page-header">
            <div>
                <span class="page-tag">EMPLOYEE MANAGEMENT</span>
                <h1>Employees</h1>
                <p>Manage and organize your employee records.</p>
            </div>

            <button class="add-employee-btn" onclick="openEmployeeForm()">
                + Add Employee
            </button>
        </div>

        <section class="employee-form" id="employeeForm">

            <div class="form-title">
                <h2>Add New Employee</h2>
                <button class="close-form-btn" onclick="closeEmployeeForm()">×</button>
            </div>

            <form id="employeeFormData">

                <div class="input-group">
                    <label for="employeeName">Full Name</label>
                    <input type="text" id="employeeName" placeholder="Enter full name" required>
                </div>

                <div class="input-group">
                    <label for="employeeEmail">Email Address</label>
                    <input type="email" id="employeeEmail" placeholder="Enter email address" required>
                </div>

                <div class="input-group">
                    <label for="employeeDepartment">Department</label>
                    <select id="employeeDepartment" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="employeePosition">Position</label>
                    <input type="text" id="employeePosition" placeholder="Enter position" required>
                </div>

                <div class="input-group">
                    <label for="employeeDate">Joining Date</label>
                    <input type="date" id="employeeDate" required>
                </div>

                <div class="input-group">
                    <label for="employeePhone">Phone Number</label>
                    <input type="tel" id="employeePhone" placeholder="Enter phone number" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-btn">Save Employee</button>
                    <button type="button" class="cancel-btn" onclick="closeEmployeeForm()">Cancel</button>
                </div>

            </form>
        </section>

        <section class="records-card">

            <div class="records-top">
                <div>
                    <h2>Employee Records</h2>
                    <p>View and manage all employees.</p>
                </div>

                <input
                    type="text"
                    id="employeeSearch"
                    class="employee-search"
                    placeholder="Search employees..."
                    onkeyup="searchEmployee()"
                >
            </div>

            <div class="table-wrapper">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Employee</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Position</th>
                            <th>Joining Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTableBody">
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <script src="js/employee.js"></script>

</body>
</html>
