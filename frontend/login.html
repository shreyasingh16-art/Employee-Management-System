<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management System</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Employee Management System
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="employees.html">Employees</a></li>
                <li><a href="attendance.html">Attendance</a></li>
                <li><a href="leave.html">Leave</a></li>
                <li>
                    <a href="login.html" class="login-btn">Login</a>
                </li>
            </ul>

        </nav>
    </header>


    <!-- Login Section -->
    <main class="login-page">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    👤
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your Employee Management System
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- Remember Me -->
                <div class="login-options">

                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-submit">
                    Login
                </button>

                <!-- Error/Success Message -->
                <p id="loginMessage"></p>

            </form>


            <!-- Back to Home -->
            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Employee Management System.
            All Rights Reserved.
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
