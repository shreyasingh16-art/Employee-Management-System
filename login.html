<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System - Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <header>
    <div class="logo">Employee Management System</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="employee.html">Employees</a>
      <a href="attendance.html">Attendance</a>
      <a href="leave.html">Leave</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <section class="login-container">
    <div class="login-box">
      <div class="avatar">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Icon">
      </div>
      <h2>Welcome Back</h2>
      <p>Login to your Employee Management System</p>

      <form>
        <input type="text" placeholder="Username" required />
        <input type="password" placeholder="Password" required />
        <div class="options">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
  </section>
</body>
</html>
